<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tienda — MarplaCity</title>
<meta name="description" content="Celulares, notebooks, audio, accesorios y electrodomésticos. Mar del Plata.">
<meta name="theme-color" content="#d97757">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">

<!-- Se ve bien cuando lo pegan en WhatsApp o Instagram -->
<meta property="og:title" content="Tienda — MarplaCity">
<meta property="og:description" content="Celulares, notebooks, audio, accesorios y electrodomésticos, con precio. Mar del Plata.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/client/styles/catalogo-publico.css">
</head>
<body>
<!-- Cabecera como la de Ecommodo: la marca, los links y el carrito con su cantidad. -->
<header class="cab" id="cab">
  <div class="wrap cab-fila">
    <a class="marca" id="marca" href="#">MarplaCity</a>
    <div class="cab-acciones">
      <a class="carrito-movil" href="#carrito" aria-label="Carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>
        <span class="carrito-globo" data-carrito hidden>0</span>
      </a>
      <button class="cab-menu" type="button" data-click="toggleMenu" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <nav class="cab-nav" id="menu">
      <a class="nav-link" href="#">Productos</a>
      <span class="nav-rubros" id="nav-rubros"></span>
      <a class="nav-link" href="#contacto" data-click="irAContacto" data-args='["$event"]'>Contacto</a>
      <a class="cab-wa" id="cab-wa" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 0 1 0 16.4 8.1 8.1 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.8zm-3.3 4.4c-.2 0-.5 0-.7.3-.3.3-1 1-1 2.3s1 2.7 1.1 2.9c.2.2 2 3.1 4.9 4.3 2.4 1 2.9.8 3.4.7.5 0 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4l-.5-.3-1.9-.9c-.3-.1-.4-.1-.6.1l-.9 1.1c-.2.2-.3.2-.6.1a7 7 0 0 1-3.4-3c-.3-.4.3-.4.8-1.5.1-.2 0-.4 0-.5l-.9-2c-.2-.6-.5-.5-.6-.5h-.6z"/></svg>
        <span>WhatsApp</span>
      </a>
      <a class="btn-carrito" href="#carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>
        <span>Carrito (<span data-carrito>0</span>)</span>
      </a>
    </nav>
  </div>
</header>

<main>
  <!-- La tienda: filtros a la izquierda, productos a la derecha. -->
  <section id="vista-tienda">
    <div class="portada" id="portada">
      <div class="wrap">
        <h1 id="portada-titulo">MarplaCity</h1>
        <p id="portada-sub">Celulares, notebooks, audio, accesorios y electrodomésticos. Mar del Plata.</p>
      </div>
    </div>
    <div class="wrap">
      <div class="burbujas" id="burbujas"></div>
      <div class="tienda">
        <button class="filtros-boton" type="button" data-click="toggleFiltros">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Buscar y filtrar
        </button>
        <aside class="filtros" id="filtros" aria-label="Filtros de productos">
          <div class="busca">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="q" placeholder="Buscar productos..." autocomplete="off" aria-label="Buscar productos" data-enter="cerrarTeclado">
          </div>
          <div id="filtros-grupos"></div>
        </aside>
        <div class="tienda-contenido">
          <nav class="miga" id="miga" aria-label="Estás en"></nav>
          <div class="conteo" id="conteo"></div>
          <div id="salida"><div class="cargando"><div class="rueda"></div><p>Cargando productos...</p></div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- El producto, el carrito, el checkout y el pedido: una página cada uno. -->
  <section id="vista-pagina" hidden><div class="wrap" id="pagina"></div></section>
</main>

<footer class="pie" id="contacto"><div class="wrap" id="pie"></div></footer>
<a class="wa-flotante" id="wa-flotante" href="#" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp" hidden>
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 0 1 0 16.4 8.1 8.1 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.8zm-3.3 4.4c-.2 0-.5 0-.7.3-.3.3-1 1-1 2.3s1 2.7 1.1 2.9c.2.2 2 3.1 4.9 4.3 2.4 1 2.9.8 3.4.7.5 0 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4l-.5-.3-1.9-.9c-.3-.1-.4-.1-.6.1l-.9 1.1c-.2.2-.3.2-.6.1a7 7 0 0 1-3.4-3c-.3-.4.3-.4.8-1.5.1-.2 0-.4 0-.5l-.9-2c-.2-.6-.5-.5-.6-.5h-.6z"/></svg>
</a>
<div class="aviso-flotante" id="aviso-flotante" role="status" aria-live="polite"></div>

<script type="module" src="/src/client/catalogo-publico.js"></script>
</body>
</html>
