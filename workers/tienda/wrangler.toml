# Config de despliegue del Worker tienda (cobros del catálogo web).
#
#   npx wrangler deploy            (parado en workers/tienda/)
#
# Es un Worker aparte del bot de Instagram, del facturador y del asistente: este cobra,
# y su token de Firebase solo puede tocar `pedidos`. Un deploy acá no puede romper a
# los otros ni al revés.
#
# Los valores de las variables NO van acá: este repo es público. Las Text viven en el
# panel de Cloudflare y los Secret se cargan con `wrangler secret put`.
#
# keep_vars, por lo mismo que en los otros tres: sin ese flag wrangler borra del Worker
# toda variable que no encuentre en este archivo.

name = "tienda"
main = "worker.js"
compatibility_date = "2026-09-06"
keep_vars = true

# Sin logs no hay forma de saber por qué un pago no impactó en el pedido.
[observability]
enabled = true
[observability.logs]
enabled = true

# Estas tres ya son públicas (viajan dentro de index.html), así que pueden vivir acá.
# Lo que no: OWNER_UID y TIENDA_EMAIL (Text en el panel) y los Secret.
[vars]
FIREBASE_PROJECT = "mis-gastos-21e7b"
FIREBASE_KEY = "AIzaSyCxT-g9yMRhrRcjwI5uz3ITTWUB8ddeZCg"
CATALOGO_URL = "https://marplacityy.github.io/marplacity-sistema/catalogo.html"
GITHUB_REPO = "marplacityy/marplacity-sistema"
TIENDA_EMAIL = "tienda@marplacity.com"
