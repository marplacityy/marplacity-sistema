# Config de despliegue del Worker ig-bot.
#
# Desde que el prompt vive en prompt.js el Worker son varios archivos, asi que ya no
# alcanza con pegar uno solo en el panel de Cloudflare: se despliega con
#
#   npx wrangler deploy            (parado en workers/ig-bot/)
#
# Los valores de las variables NO van aca: este repo es publico. Viven en el panel de
# Cloudflare, y para probar en local en .dev.vars (ignorado por git).
#
# Por eso mismo esta keep_vars: sin ese flag, wrangler BORRA del Worker toda variable
# que no encuentre en este archivo. Como aca no hay ninguna, un deploy se llevaba
# puestas las cuatro Text del panel (FIREBASE_PROJECT, FIREBASE_KEY, OWNER_UID,
# BOT_EMAIL) y el bot quedaba sin poder loguearse a Firebase: recibia los DM, no
# contestaba y no guardaba nada. Paso el 22/08/2026. Los Secret no se tocan.
#
# Igual, despues de cada deploy conviene abrir https://ig-bot.fiwind702050.workers.dev/
# y confirmar que la lista de `vars` este toda en true.

name = "ig-bot"
main = "worker-ig.js"
compatibility_date = "2026-08-21"
keep_vars = true

# Seguimiento de los que quedaron en silencio: corre cada hora en punto (UTC) y adentro
# decide a quien le escribe, segun las ventanas de 20 h y 24 h de worker-ig.js.
[triggers]
crons = ["0 * * * *"]

# El Worker tenia los logs prendidos en el panel y el primer deploy los apago, por lo
# mismo que las variables: lo que no esta en este archivo, wrangler lo deja en el
# default. Sin esto no hay historial de logs en el panel, que es justo lo unico que
# muestra por que el bot no contesto un DM: los errores se loguean y se sigue.
[observability]
enabled = true
[observability.logs]
enabled = true
