<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Documento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/client/styles/documento-publico.css">
</head>
<body>
<div class="wrap">

  <div class="card" id="cargando">
    <div class="spinner"></div>
    <div style="color:var(--text2);font-size:.9rem">Abriendo el documento…</div>
  </div>

  <div class="card err" id="error" hidden>
    <h1 id="err-t">No pudimos abrir el documento</h1>
    <p class="meta" id="err-d" style="margin-bottom:0"></p>
  </div>

  <div id="ok" hidden>
    <div class="card">
      <div class="local" id="d-local"></div>
      <h1 id="d-titulo"></h1>
      <p class="meta" id="d-meta"></p>
      <a class="btn" id="d-bajar" download>📄 Descargar PDF</a>
      <a class="btn btn-ghost" id="d-abrir" target="_blank" rel="noopener">Abrir en otra pestaña</a>
    </div>
    <div class="visor" id="d-visor"><iframe id="d-frame" title="Vista previa del documento"></iframe></div>
    <p class="pie" id="d-pie"></p>
  </div>

</div>

<script type="module" src="/src/client/documento-publico.js"></script>
</body>
</html>
